name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sapatorl-cosmetics
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: sapatorl_ Cosmetics (Build ${{ github.run_number }})
          make_latest: true
          files: |
            build/libs/sapatorl-cosmetics-*.jar

      - name: Inspect API
        if: always()
        run: |
          J=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          echo "=== AvatarRenderer sigs"; javap -s -p -cp "$J" net.minecraft.client.renderer.entity.player.AvatarRenderer | grep -A1 -E 'extractRenderState|class '
          echo "=== AvatarRenderer.extractRenderState body"; javap -c -p -cp "$J" net.minecraft.client.renderer.entity.player.AvatarRenderer | sed -n '/public void extractRenderState(AvatarlikeEntity/,/^$/p' | grep -E 'invoke|headItem|putfield|getfield' | head -60
          echo "=== LivingEntityRenderer.extractRenderState body"; javap -c -p -cp "$J" net.minecraft.client.renderer.entity.LivingEntityRenderer | sed -n '/public void extractRenderState(T, S, float)/,/^$/p' | grep -E 'invoke|headItem|wornHead' | head -60
          echo "=== who touches headItem"; for c in $(unzip -l "$J" | awk '{print $4}' | grep -E '^net/minecraft/client/renderer/entity/.*\.class$' | sed 's/\.class$//; s#/#.#g'); do javap -c -p -cp "$J" "$c" 2>/dev/null | grep -q 'LivingEntityRenderState.headItem' && echo "$c"; done
