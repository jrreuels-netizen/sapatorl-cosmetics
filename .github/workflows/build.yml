name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sapatorl-cosmetics
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: sapatorl_ Cosmetics (Build ${{ github.run_number }})
          make_latest: true
          files: |
            build/libs/sapatorl-cosmetics-*.jar

      - name: Inspect API
        if: always()
        run: |
          J=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          [ -f "$J" ] || J=$(find ~/.gradle/caches -name 'minecraft-merged*.jar' | head -1)
          echo "=== LivingEntityRenderer"; javap -p -cp "$J" net.minecraft.client.renderer.entity.LivingEntityRenderer | grep -i extract
          echo "=== AvatarRenderer"; javap -p -cp "$J" net.minecraft.client.renderer.entity.player.AvatarRenderer | grep -i extract
          echo "=== LivingEntityRenderState"; javap -p -cp "$J" net.minecraft.client.renderer.entity.state.LivingEntityRenderState | grep -i head
          echo "=== CustomHeadLayer"; javap -p -c -cp "$J" net.minecraft.client.renderer.entity.layers.CustomHeadLayer | grep -i -E 'headItem|submit|render' | head -20
          echo "=== Mixin check"; unzip -p build/libs/sapatorl-cosmetics-1.0.0.jar sapatorl_cosmetics.mixins.json
