name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sapatorl-cosmetics
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: sapatorl_ Cosmetics (Build ${{ github.run_number }})
          make_latest: true
          files: |
            build/libs/sapatorl-cosmetics-*.jar

      - name: Inspect API
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches -path '*minecraft*' -name '*.jar' -size +10M | grep -i -E 'client|merged|common|minecraft' | head -5)
          echo "$JAR"
          J=$(echo "$JAR" | grep -i -E 'merged|client' | head -1); [ -z "$J" ] && J=$(echo "$JAR" | head -1)
          echo "USING $J"
          for c in com.mojang.blaze3d.platform.InputConstants 'com.mojang.blaze3d.platform.InputConstants$Type' 'com.mojang.blaze3d.platform.InputConstants$Key' net.minecraft.client.KeyMapping; do echo "=== $c"; javap -cp "$J" "$c" | head -60; done
          echo "=== Minecraft screen-related"; javap -cp "$J" net.minecraft.client.Minecraft | grep -i -E 'screen|gui' | head -40
          echo "=== key constants"; unzip -l "$J" | grep -i -E 'platform/(Key|Input|Sdl|SDL)' | head -30
