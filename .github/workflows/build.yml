name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: sapatorl-cosmetics
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: sapatorl_ Cosmetics (Build ${{ github.run_number }})
          make_latest: true
          files: |
            build/libs/sapatorl-cosmetics-*.jar
